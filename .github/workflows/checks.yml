name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Detect dependency changes
        id: dependencies
        shell: pwsh
        env:
          EVENT_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $baseRevision = $env:EVENT_BASE
          if ($env:PR_BASE) { $baseRevision = $env:PR_BASE }
          if (-not $baseRevision -or $baseRevision -match '^0+$') {
            $baseRevision = git rev-parse --verify HEAD^ 2>$null
            if ($LASTEXITCODE -ne 0) { $baseRevision = $null }
          }
          $changed = 'true'
          if ($baseRevision) {
            git diff --quiet $baseRevision HEAD -- requirements.txt requirements-dev.txt requirements-build.txt pyproject.toml
            if ($LASTEXITCODE -eq 0) { $changed = 'false' }
            elseif ($LASTEXITCODE -ne 1) { throw 'Dependency comparison failed' }
          }
          "changed=$changed" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Audit declared dependencies before project installation
        if: steps.dependencies.outputs.changed == 'true'
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements-dev.txt -r requirements-build.txt
      - name: No dependency changes
        if: steps.dependencies.outputs.changed != 'true'
        run: Write-Output 'Dependency files are unchanged in this change.'

  test-and-package:
    needs: dependency-audit
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt
            pyproject.toml
      - name: Validate the single version source and exact release tag
        shell: pwsh
        run: |
          $version = python -c 'from ecoflow_monitor import __version__; print(__version__)'
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Invalid application version'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $version) {
            throw 'Tag must match the application version exactly, without a v prefix'
          }
      - name: Install application and check dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Run the full suite
        run: python -m pytest -q
      - name: Build the Python wheel
        run: python -m pip wheel --no-deps --wheel-dir dist/wheels .
      - name: Verify packaged metadata and all language catalogs
        run: python -m scripts.check_package dist/wheels
      - name: Build portable executable
        if: matrix.python == '3.13'
        run: python build.py
      - name: Smoke the actual executable
        if: matrix.python == '3.13'
        run: python -m scripts.smoke_executable dist/EcoFlowMonitor.exe
      - name: Check whitespace
        run: git diff --check
