name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Detect dependency changes
        id: dependencies
        shell: pwsh
        env:
          EVENT_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $baseRevision = $env:EVENT_BASE
          if ($env:PR_BASE) { $baseRevision = $env:PR_BASE }
          if (-not $baseRevision -or $baseRevision -match '^0+$') {
            $baseRevision = git rev-parse --verify HEAD^ 2>$null
            if ($LASTEXITCODE -ne 0) { $baseRevision = $null }
          }
          $changed = 'true'
          if ($baseRevision) {
            git diff --quiet $baseRevision HEAD -- requirements.txt requirements-dev.txt requirements-build.txt pyproject.toml
            if ($LASTEXITCODE -eq 0) { $changed = 'false' }
            elseif ($LASTEXITCODE -ne 1) { throw 'Dependency comparison failed' }
          }
          "changed=$changed" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Audit declared dependencies before project installation
        if: steps.dependencies.outputs.changed == 'true'
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements-dev.txt -r requirements-build.txt
      - name: No dependency changes
        if: steps.dependencies.outputs.changed != 'true'
        run: Write-Output 'Dependency files are unchanged in this change.'

  test-and-package:
    needs: dependency-audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt
            pyproject.toml
      - name: Validate the single version source and exact release tag
        shell: pwsh
        run: |
          $version = python -c 'from ecoflow_monitor import __version__; print(__version__)'
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Invalid application version'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $version) {
            throw 'Tag must match the application version exactly, without a v prefix'
          }
      - name: Install application and check dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Run the full functional suite
        run: python -m pytest -q -m "not design"
      - name: Build the Python wheel
        run: python -m pip wheel --no-deps --wheel-dir dist/wheels .
      - name: Verify packaged metadata and all language catalogs
        run: python -m scripts.check_package dist/wheels
      - name: Build portable executable
        run: python build.py
      - name: Smoke the actual executable
        shell: pwsh
        run: |
          $version = python -c 'from ecoflow_monitor import __version__; print(__version__)'
          python -m scripts.smoke_executable "dist/$version/EcoFlowMonitor.exe"
      - name: Check whitespace
        run: git diff --check

  release-build:
    needs: test-and-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Read canonical version
        id: version
        shell: pwsh
        run: |
          $version = python -c 'from scripts.release import validate_version; print(validate_version())'
          if ($LASTEXITCODE -ne 0) { throw 'Invalid version' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install NSIS
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'nsis-3.12-setup.exe'
          Invoke-WebRequest -Uri 'https://prdownloads.sourceforge.net/nsis/nsis-3.12-setup.exe' -OutFile $setup
          $header = [System.IO.File]::ReadAllBytes($setup)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            $match = [regex]::Match((Get-Content -LiteralPath $setup -Raw), 'http-equiv="refresh" content="\d+; url=([^"\s]+)"')
            if (-not $match.Success) { throw 'NSIS download did not return an executable or mirror redirect' }
            $mirror = [uri][System.Net.WebUtility]::HtmlDecode($match.Groups[1].Value)
            if ($mirror.Scheme -ne 'https' -or -not $mirror.Host.EndsWith('.sourceforge.net')) { throw 'Unexpected NSIS mirror' }
            Invoke-WebRequest -Uri $mirror -OutFile $setup
          }
          $expected = '3BC2B06253A7E4957111BE152AC6A536E0C7478A706E19DA814038DB5D706495'
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne $expected) { throw 'NSIS checksum mismatch' }
          $process = Start-Process -FilePath $setup -ArgumentList /S -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'NSIS installation failed' }
      - name: Build complete release
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ github.ref_type == 'tag' && secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 || '' }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ github.ref_type == 'tag' && secrets.WINDOWS_TIMESTAMP_URL || '' }}
        run: ./scripts/prepare-release.ps1 -Build
      - name: Smoke machine installation on disposable runner
        run: ./scripts/installer-smoke-test.ps1 -Version '${{ steps.version.outputs.value }}'
      - name: Validate release and WinGet manifests
        shell: pwsh
        run: |
          ./scripts/verify-release.ps1
          winget validate --manifest 'dist/release/${{ steps.version.outputs.value }}/winget' --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'WinGet validation failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: ecoflow-monitor-${{ steps.version.outputs.value }}
          path: dist/release/${{ steps.version.outputs.value }}/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ecoflow-monitor-${{ github.ref_name }}
          path: release
      - name: Publish verified version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" release/*.exe release/*.zip release/SHA256SUMS.txt --verify-tag --generate-notes --title "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY"
