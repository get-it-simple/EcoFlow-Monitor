[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoflow-monitoring-win-support"
dynamic = ["version", "dependencies"]
description = "EcoFlow device monitoring and modular CLI profile automation for Windows"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.gui-scripts]
ecoflow-monitor = "ecoflow_monitor.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "ecoflow_monitor.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["ecoflow_monitor*"]
namespaces = false

[tool.setuptools.package-data]
"ecoflow_monitor.i18n" = ["*/strings.json"]
"ecoflow_monitor.ui" = ["assets/*.svg", "assets/*.ico", "assets/*.json", "assets/fonts/*.ttf", "assets/fonts/*.txt"]
"ecoflow_monitor.integration_examples" = ["*.json"]
